<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<title>Promo 440×280</title>
	<style>
		html, body { margin: 0; width: 440px; height: 280px; background: #000; color: #e8e8e8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		.wrap {
			width: 440px;
			height: 280px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 14px;
		}
		img { width: 88px; height: 88px; }
		h1 { margin: 0; font-size: 36px; font-weight: 650; letter-spacing: -0.03em; color: #fff; }
		p { margin: 0; font-size: 16px; color: #b3b3b3; }
	</style>
</head>
<body>
	<div class="wrap">
		<img src="../../Autoscroll/icon-128.png" alt="">
		<h1>Autoscroll</h1>
		<p>Scroll to the bottom of the page</p>
	</div>
</body>
</html>
