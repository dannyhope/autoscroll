<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<title>Marquee 1400×560</title>
	<style>
		html, body { margin: 0; width: 1400px; height: 560px; background: #000; color: #e8e8e8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		.wrap {
			width: 1400px;
			height: 560px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 48px;
		}
		img { width: 220px; height: 220px; }
		h1 { margin: 0 0 12px; font-size: 72px; font-weight: 650; letter-spacing: -0.03em; color: #fff; }
		p { margin: 0; font-size: 28px; color: #b3b3b3; }
	</style>
</head>
<body>
	<div class="wrap">
		<img src="../../Autoscroll/icon-128.png" alt="">
		<div>
			<h1>Autoscroll</h1>
			<p>Scroll to the bottom of the page</p>
		</div>
	</div>
</body>
</html>
